<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メンテナンスのお知らせ</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        line-height: 1.8;
      }
      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
      }
      main {
        width: min(36rem, 85vw);
        padding-block: 3rem;
      }
      h1 {
        font-size: clamp(1.5rem, 4vw, 2rem);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ただいまメンテナンスを実施しています</h1>
      <p>サービスを一時停止しています。ご利用の皆さまにはご不便をおかけします。</p>
      <p>復旧予定は確認中です。状況が分かり次第、このページでお知らせします。</p>
      <p>時間をおいて、もう一度アクセスしてください。</p>
    </main>
  </body>
</html>
