name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: app_template
          POSTGRES_USER: app_template
          POSTGRES_PASSWORD: app_template
        options: >-
          --health-cmd "pg_isready -U app_template -d app_template"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://app_template:app_template@localhost:5432/app_template
      DATABASE_MIGRATION_URL: postgres://app_template:app_template@localhost:5432/app_template
      BETTER_AUTH_SECRET: ci-secret-change-me-32-characters-minimum
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          check-latest: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database
        run: pnpm db:wait && pnpm db:migrate && pnpm db:seed

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run CI checks
        run: pnpm ci
