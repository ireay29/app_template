version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: '@testing-library/jest-dom'
        versions:
          - '6.10.0'
    groups:
      better-auth:
        applies-to: version-updates
        patterns:
          - better-auth
          - '@better-auth/*'
      vitest:
        applies-to: version-updates
        patterns:
          - vitest
          - '@vitest/*'
      better-auth-security:
        applies-to: security-updates
        patterns:
          - better-auth
          - '@better-auth/*'
      vitest-security:
        applies-to: security-updates
        patterns:
          - vitest
          - '@vitest/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
