services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '${POSTGRES_PORT:-15432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_template}
      POSTGRES_USER: ${POSTGRES_USER:-app_template}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_template}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
